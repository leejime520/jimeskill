<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="GHSFQCqGkGtS0WBhB2EiOg">
<head data-page-node-id="iOJqpUseKybEsLVP0jDaWF">

<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="mnvrav12zEjd1kYRymibsK">
<title>旅行社经营与管理综合实训平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#dbeafe;--primary-bg:#eff6ff;
--sidebar-bg:#1e293b;--sidebar-active:#2563eb;--sidebar-text:#cbd5e1;--sidebar-hover:#334155;
--bg:#f0f4f8;--card:#fff;--text:#1f2937;--text-light:#6b7280;--border:#e5e7eb;
--danger:#dc2626;--danger-bg:#fef2f2;--success:#16a34a;--success-bg:#f0fdf4;
--warning:#f59e0b;--warning-bg:#fffbeb;--shadow:0 1px 3px rgba(0,0,0,.1);--radius:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
input,textarea{font-size:13px;font-family:inherit}
select{font-size:13px;font-family:inherit}
svg{width:20px;height:20px;flex-shrink:0}
/* Login */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e293b,#2563eb)}
.login-card{background:#fff;border-radius:12px;padding:40px;width:400px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.login-card h1{text-align:center;font-size:22px;margin-bottom:4px;color:var(--primary)}
.login-card .subtitle{text-align:center;color:var(--text-light);margin-bottom:24px;font-size:13px}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-weight:600;font-size:14px}
.form-group input:not(.date-picker),.form-group select{width:100%;padding:0 12px;height:42px;box-sizing:border-box;border:1px solid var(--border);border-radius:6px;outline:none;transition:border .2s;background:#fff}
.form-group input:focus,.form-group select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
/* 可搜索下拉组件 */
.ss-wrap{position:relative;width:100%;flex:1 1 auto;min-width:0}
.ss-control{display:flex;align-items:center;justify-content:space-between;width:100%;height:42px;padding:0 12px;box-sizing:border-box;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:13px;user-select:none;transition:border .2s}
.ss-control:hover{border-color:#cbd5e1}
.ss-control.open{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.ss-control .ss-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left}
.ss-control .ss-caret{width:16px;height:16px;color:var(--text-light);flex-shrink:0;transition:transform .2s}
.ss-control.open .ss-caret{transform:rotate(180deg)}
.ss-popup{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:3000;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);overflow:hidden}
.ss-search-wrap{padding:8px;border-bottom:1px solid var(--border)}
.ss-search{width:100%;height:34px;padding:0 10px;box-sizing:border-box;border:1px solid var(--border);border-radius:6px;outline:none;font-size:13px;background:#fff}
.ss-search:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.ss-list{max-height:178px;overflow-y:auto;padding:4px}
.ss-option{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-option:hover,.ss-option.hl{background:var(--primary-bg);color:var(--primary-dark)}
.ss-option.selected{background:var(--primary-light);color:var(--primary-dark);font-weight:600}
.ss-empty{padding:14px;text-align:center;color:var(--text-light);font-size:13px}
.it-cat-row .ss-control{font-size:13px;padding:0 8px}
.filter-bar .ss-wrap{flex:0 0 auto;width:auto}
.filter-bar .ss-control{width:auto;min-width:130px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;text-decoration:none}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:#e5e7eb;color:var(--text)}.btn-secondary:hover{background:#d1d5db}.btn:disabled{opacity:.55;cursor:not-allowed}.btn-primary:disabled{background:#94a3b8;color:#fff}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-success{background:var(--success);color:#fff}
.btn-add{background:var(--primary);color:#fff}.btn-add:hover{background:var(--primary-dark)}
.btn.btn-add{font-size:13px;padding:2px 9px}
.btn-add svg{width:11px;height:11px;margin-right:4px}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-toggle{background:#eef2ff;color:var(--primary);border:1px solid #c7d2fe}
.btn-toggle:hover{background:#e0e7ff}
.btn-toggle-active{background:var(--primary);color:#fff;border:1px solid var(--primary)}
.btn-toggle-active:hover{background:var(--primary-dark)}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{background:#f1f5f9}
.sort-ind{color:var(--primary);font-size:11px;margin-left:2px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
.pager-info{font-size:13px;color:var(--text-light)}
.pager-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pg-btn{min-width:32px;padding:5px 9px;font-size:13px;border:1px solid #d1d5db;background:#fff;border-radius:6px;cursor:pointer;transition:.15s}
.pg-btn:hover:not(:disabled){background:#f1f5f9;border-color:#94a3b8}
.pg-btn:disabled{color:#cbd5e1;cursor:not-allowed;background:#f8fafc}
.pg-cur{background:var(--primary);color:#fff;border-color:var(--primary)}
.pg-cur:hover:not(:disabled){background:var(--primary-dark)}
.pg-ellipsis{color:#94a3b8;padding:0 2px}
.field-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.field-head label{margin-bottom:0}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.section-head h3{margin:0;font-size:14px;font-weight:600}
.btn-block{width:100%}
.btn-icon{background:none;border:none;cursor:pointer;padding:4px;border-radius:4px;color:var(--text-light);display:inline-flex;align-items:center}
.btn-icon:hover{background:#f3f4f6;color:var(--text)}
.login-toggle{text-align:center;margin-top:16px;font-size:13px;color:var(--text-light)}
.login-toggle a{color:var(--primary);cursor:pointer;text-decoration:none}
.login-error{color:var(--danger);font-size:13px;margin-bottom:12px;display:none}
.role-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge-teacher{background:var(--primary-light);color:var(--primary-dark)}
.badge-student{background:var(--success-bg);color:var(--success)}
/* Layout */
#mainApp{display:flex;min-height:100vh}
#sidebar{width:240px;background:var(--sidebar-bg);color:var(--sidebar-text);padding:0;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto;transition:transform .3s;display:flex;flex-direction:column}
.sidebar-logo{padding:18px 16px;font-size:14px;line-height:1.5;font-weight:700;color:#fff;border-bottom:1px solid #334155;text-align:center}
.sidebar-logo span{color:#60a5fa}
.sidebar-user{padding:16px 24px;border-bottom:1px solid #334155}
.sidebar-user .name{color:#fff;font-weight:600;font-size:14px}
.sidebar-user .role{margin-top:4px}
.nav-section{padding:12px 0;flex:1}
.nav-section-title{padding:4px 24px;font-size:11px;text-transform:uppercase;color:#64748b;letter-spacing:.5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 24px;cursor:pointer;transition:.2s;border-left:3px solid transparent}
.nav-item:hover{background:var(--sidebar-hover)}
.nav-item.active{background:var(--sidebar-active);border-left-color:#60a5fa;color:#fff}
.nav-item svg{width:18px;height:18px}
.sidebar-footer{padding:14px 16px 18px;font-size:12px;color:#94a3b8;border-top:1px solid #334155;line-height:1.6;text-align:center}
#mainContent{flex:1;margin-left:240px;transition:margin .3s}
#topBar{background:#fff;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);position:sticky;top:0;z-index:50}
.topbar-left{display:flex;align-items:center;gap:16px}
.topbar-title{font-size:18px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:12px}
#pageContent{padding:24px}
/* Cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
.card-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stats-grid-5{grid-template-columns:repeat(5,1fr)}
.stat-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;display:flex;align-items:center;gap:16px}
.stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-icon svg{width:24px;height:24px;color:#fff}
.stat-info .value{font-size:28px;font-weight:800;line-height:1.2}
.stat-info .label{font-size:13px;color:var(--text-light)}
/* Today Tasks */
.today-tasks{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px;border-left:4px solid var(--primary)}
.today-tasks .header{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:16px;font-weight:700}
.task-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:6px;margin-bottom:8px;background:#f9fafb}
.task-item.overdue{background:var(--danger-bg);border-left:3px solid var(--danger)}
.task-item.today{background:var(--primary-bg);border-left:3px solid var(--primary)}
.task-item.upcoming{background:var(--warning-bg);border-left:3px solid var(--warning)}
.task-item.pending{background:#f9fafb;border-left:3px solid #9ca3af}
.task-info .task-title{font-weight:600;font-size:14px}
.task-info .task-detail{font-size:12px;color:var(--text-light);margin-top:2px}
/* 待办事项看板（今日聚焦·时间轴） */
.todo-board{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px;border-left:4px solid var(--primary)}
.todo-board .header{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:16px;font-weight:700}
.todo-count{margin-left:auto;font-size:13px;font-weight:600;color:var(--primary);background:var(--primary-bg);padding:2px 10px;border-radius:10px}
.todo-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.todo-filters .chip{font-size:13px;padding:5px 14px;border:1px solid var(--border);background:#fff;color:var(--text-light);border-radius:999px;cursor:pointer;transition:.15s}
.todo-filters .chip:hover{border-color:var(--primary);color:var(--primary)}
.todo-filters .chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.todo-pager{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:14px 4px 2px;border-top:1px solid var(--border);margin-top:8px}
.todo-pager .pg-btn{font-size:13px;min-width:32px;height:30px;padding:0 10px;border:1px solid var(--border);background:#fff;color:var(--text-light);border-radius:6px;cursor:pointer;transition:.15s}
.todo-pager .pg-btn:hover:not([disabled]):not(.active){border-color:var(--primary);color:var(--primary)}
.todo-pager .pg-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.todo-pager .pg-btn[disabled]{opacity:.45;cursor:not-allowed}
.todo-pager .pg-ellipsis{color:var(--text-light);padding:0 2px}
.todo-pager .pg-info{margin-left:8px;font-size:12px;color:var(--text-light)}
/* —— 订单流程监控（紧凑表格） —— */
.flowmon{width:100%;font-size:13px;overflow-x:auto}
.fm-row{display:grid;grid-template-columns:122px minmax(80px,1fr) 84px 112px minmax(360px,2fr) minmax(120px,1fr) 82px;align-items:center;gap:14px;padding:7px 8px;border-bottom:1px solid #f0f1f3}
.fm-row.fm-head{font-size:12px;font-weight:700;color:var(--text-light);background:#f7f8fa;border-bottom:1px solid var(--border);padding:7px 8px}
.fm-row.fm-head>span{font-size:12px;font-weight:700;color:var(--text-light);text-align:center}
.fm-row:hover:not(.fm-head){background:#f7f8fa}
.fm-no{line-height:1.3;text-align:center}
.fm-no b{font-weight:700}
.fm-sub{font-size:11px;color:var(--text-light)}
.fm-route{color:var(--text-light);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.fm-dep{text-align:center;color:var(--text-light);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;gap:1px}
.fm-dep b{font-weight:700;font-size:13px}
.fm-dep-sub{font-size:10px;font-weight:600;color:var(--text-light)}
.fm-money{text-align:center;font-weight:600;font-size:12px;line-height:1.3}
.fm-money-zero{color:var(--danger);font-weight:700}
.fm-flow{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;padding-left:6px}
.nd-row{position:relative;display:flex;align-items:flex-end;justify-content:flex-start;width:100%;gap:0;padding-bottom:0}
.nd-cell{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1 1 0;min-width:0;position:relative;z-index:1}
.nd-cell::after{content:'';position:absolute;bottom:5.5px;left:50%;width:100%;height:2px;background:#e2e8f0;z-index:0;border-radius:2px}
.nd-cell:last-child::after{display:none}
.nd-cell.nd-seg-done::after{background:#22c55e}
.nd-cell.nd-seg-cur::after{background:#f59e0b}
.nd-label{font-size:10px;line-height:1.1;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center}
.nd{display:inline-block;width:11px;height:11px;border-radius:50%;flex:0 0 auto;position:relative;z-index:1}
.nd-done{background:#22c55e}
.nd-current{background:#f59e0b}
.nd-todo{background:#cbd5e1}
.fm-pending{flex:1 1 130px;min-width:110px;font-size:12px;color:var(--text);text-align:center}
.fm-pend-zero{color:var(--danger);font-weight:600}
.fm-act{flex:0 0 70px;text-align:center}
.fm-zero{background:#fffbeb}
/* Tables */
.table-wrap{overflow-x:auto;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#f8fafc;padding:12px 16px;text-align:left;font-weight:600;color:var(--text-light);white-space:nowrap;border-bottom:2px solid var(--border)}
td{padding:10px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:hover{background:#f9fafb}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
/* 订单表单-团队成员列表 */
.of-members-table th{padding:8px 10px;font-size:13px}
.of-members-table td{padding:6px 8px;vertical-align:middle}
.of-members-table .of-idx{text-align:center;color:var(--text-light);font-size:12px}
.of-members-table .of-empty{text-align:center;color:var(--text-light);padding:18px}
/* 团队成员录入弹窗（独立浮层，叠加在订单 Modal 之上） */
.mm-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:1500;padding:16px}
.mm-card{background:#fff;border-radius:12px;width:520px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:mm-pop .15s ease}
@keyframes mm-pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.mm-head{padding:16px 22px;border-bottom:1px solid var(--border);font-size:16px;font-weight:700}
.mm-body{padding:16px 22px}
.mm-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.badge-gray{background:#f3f4f6;color:#6b7280}
.badge-blue{background:var(--primary-light);color:var(--primary-dark)}
.badge-green{background:var(--success-bg);color:var(--success)}
.badge-amber{background:var(--warning-bg);color:#b45309}
.badge-red{background:var(--danger-bg);color:var(--danger)}
.badge-dark-green{background:#dcfce7;color:#15803d}
/* 团期状态（自动判定：渐变实底+白字+状态点，更大气） */
.badge-recruiting,.badge-ontour,.badge-completed{display:inline-flex;align-items:center;gap:6px;padding:4px 13px;border-radius:999px;font-size:12px;font-weight:600;line-height:1;letter-spacing:.5px;white-space:nowrap}
.badge-recruiting::before,.badge-ontour::before,.badge-completed::before{content:'';width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.badge-recruiting{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;box-shadow:0 2px 8px rgba(22,163,74,.35);animation:recruitPulse 2.2s ease-in-out infinite}
.badge-ontour{background:linear-gradient(135deg,#ea580c,#fb923c);color:#fff;box-shadow:0 2px 8px rgba(234,88,12,.35)}
.badge-completed{background:linear-gradient(135deg,#dc2626,#f05252);color:#fff;box-shadow:0 2px 8px rgba(220,38,38,.35)}
@keyframes recruitPulse{0%,100%{box-shadow:0 2px 8px rgba(22,163,74,.35)}50%{box-shadow:0 2px 15px rgba(34,197,94,.65)}}
/* Forms */
.form-row{display:flex;gap:16px;margin-bottom:16px}
.form-row .form-group{flex:1}
.sf-val{padding:8px 0;font-size:13px;color:var(--text);border-bottom:1px solid var(--border)}
.form-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;outline:none;resize:vertical;font-family:inherit}
textarea:focus{border-color:var(--primary)}
/* Modal */
#modalOverlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
#modalOverlay.show{display:flex}
#modal{background:#fff;border-radius:12px;width:100%;max-width:800px;max-height:90vh;display:flex;flex-direction:column}
.modal-large{max-width:900px}
.modal-header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:move;user-select:none;-webkit-user-select:none;touch-action:none}
.modal-header h2{font-size:18px;font-weight:700}
.modal-body{padding:24px;overflow-y:auto;flex:1}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:12px}
/* Itinerary */
.itinerary-day{border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;background:#fafbfc}
.itinerary-day .day-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.itinerary-day .day-head strong{font-size:15px;color:var(--primary)}
.it-cat-stack{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.it-cat-section{padding:0}
.it-cat-title{font-size:14px;font-weight:600;margin-bottom:6px;color:var(--text)}
.it-cat-row{display:grid;grid-template-columns:42px 1fr;gap:6px;align-items:center}
.it-cat-row label{font-size:12px;font-weight:600;color:#6b7280;text-align:right}
.it-cat-row select{font-size:13px;padding:0 8px;height:42px;box-sizing:border-box;background:#fff}
.it-cat-row.ticket-row{grid-template-columns:42px 1fr 28px}
.meal-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.meal-item{display:flex;flex-direction:column}
.meal-item label{font-size:12px;font-weight:600;color:#6b7280;margin-bottom:4px}
.meal-item select{font-size:13px;padding:0 8px;height:42px;box-sizing:border-box;background:#fff}
.add-ticket{margin-top:6px;text-align:right}
.ticket-list{margin-bottom:2px}
.it-desc-group{margin-top:12px}
/* Itinerary display (view mode) */
.it-display-cat{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 10px;border-radius:12px;margin:2px 4px 2px 0;font-weight:600}
.it-display-cat.cat-meal{background:#fef3c7;color:#92400e}
.it-display-cat.cat-hotel{background:#dbeafe;color:#1e40af}
.it-display-cat.cat-ticket{background:#d1fae5;color:#065f46}
.it-display-cat.cat-transport{background:#ede9fe;color:#5b21b6}
.it-display-cat svg{width:13px;height:13px;flex-shrink:0}

function createSB(baseUrl,key){
  var H={'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json'};
  function qb(table){
    var st={table:table,method:'select',cols:'*',filters:[],single:false,body:null};
    function run(){
      var base=baseUrl.replace(/\/+$/,'')+'/rest/v1/'+st.table;
      var qs=[];
      if(st.method==='select')qs.push('select='+encodeURIComponent(st.cols));
      st.filters.forEach(function(f){qs.push(encodeURIComponent(f.col)+'='+f.op+'.'+encodeURIComponent(f.val))});
      var url=base+(qs.length?'?'+qs.join('&'):'');
      var opt={method:st.method==='select'?'GET':(st.method==='delete'?'DELETE':(st.method==='update'?'PATCH':'POST')),headers:Object.assign({},H)};
      if(st.method==='upsert'||st.method==='insert'){opt.headers['Prefer']='resolution=merge-duplicates';opt.body=JSON.stringify(Array.isArray(st.body)?st.body:[st.body])}
      else if(st.method==='update'){opt.body=JSON.stringify(st.body)}
      return fetch(url,opt).then(function(r){return r.json().then(function(j){var arr=Array.isArray(j)?j:(j?[j]:[]);return {data:st.single?(arr[0]||null):arr,error:r.ok?null:((j&&j.message)||('http_'+r.status))}},function(){return {data:st.single?null:[],error:'parse_error'}})}).catch(function(e){return {data:st.single?null:[],error:e}});
    }
    var b={
      select:function(c){st.method='select';st.cols=c||'*';return b},
      insert:function(o){st.method='insert';st.body=o;return b},
      update:function(o){st.method='update';st.body=o;return b},
      upsert:function(o){st.method='upsert';st.body=o;return b},
      delete:function(){st.method='delete';return b},
      eq:function(c,v){st.filters.push({col:c,op:'eq',val:v});return b},
      like:function(c,v){st.filters.push({col:c,op:'like',val:v});return b},
      maybeSingle:function(){st.single=true;return b},
      single:function(){st.single=true;return b},
      then:function(res,rej){return run().then(res,rej)}
    };
    return b;
  }
  return {from:function(t){return qb(t)},channel:function(){return {on:function(){return this},subscribe:function(){return {unsubscribe:function(){}}}}}};
}

/* 账号变更专用：返回 Promise 的可等待写入。
   关键操作（注册 / 自助找回密码 / 教师重置密码）必须先 await 成功再放行，

   导致新密码只存在于本机 localStorage——当时能登录，换台设备即失效。 */
function upsertCloudRowAsync(rowId,data){
  if(!SB)return Promise.reject(new Error('云端未连接'));
  return SB.from('app_state').upsert({id:rowId,data:data,updated_at:new Date().toISOString()}).then(function(res){
    if(res.error)throw res.error;
    try{updateSyncStatus()}catch(e){}
    return true;
  });
}

function migrateLegacyShared(shared){
  var po=_privatePart(shared);
  var hasPriv=PRIVATE_FIELDS.some(function(f){return (po[f]||[]).length>0});
  if(!hasPriv)return;
  var groups={};
  PRIVATE_FIELDS.forEach(function(f){(po[f]||[]).forEach(function(rec){var k='user_'+(rec.createdBy||'anon');if(!groups[k]){groups[k]={};PRIVATE_FIELDS.forEach(function(g){groups[k][g]=[]})}groups[k][f].push(rec)})});
  Object.keys(groups).forEach(function(k){writeLocalRow(DB_KEY+'_'+k,groups[k]);upsertCloudRow(k,groups[k])});
  PRIVATE_FIELDS.forEach(function(f){shared[f]=[]});

}

async function loadAllAccounts(legacyUsers){
  var map={};
  function add(u){if(u&&u.id&&!map[u.id])map[u.id]=u;}
  if(SB){
    try{var r=await SB.from('app_state').select('id,data').like('id','acct_%');(r.data||[]).forEach(function(x){if(x&&x.data)add(x.data)})}catch(e){console.warn('云端账号读取失败',e)}
  }
  if(Object.keys(map).length===0){
    try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(DB_KEY+'_acct_')===0){var o=readRawLocal(k);if(o)add(o)}}}catch(e){console.warn('本地账号读取失败',e)}
  }
  (legacyUsers||[]).forEach(add);
  var list=Object.keys(map).map(function(k){return map[k]});
  if(list.length===0)list=getDefaultUsers();
  return list;
}
async function loadData(){
  var shared=await readCloudRow(SB_ID)||readLocalRow(DB_KEY)||getDefaultData();
  migrateLegacyShared(shared);
  var legacyUsers=(shared&&Array.isArray(shared.users))?shared.users:[];
  var d=_sharedPart(shared);
  PRIVATE_FIELDS.forEach(function(f){d[f]=[]});
  var collect=function(dd){PRIVATE_FIELDS.forEach(function(f){(dd[f]||[]).forEach(function(rec){d[f].push(rec)})})};
  if(currentUser&&currentUser.role==='teacher'){
    if(SB){try{var r=await SB.from('app_state').select('id,data').like('id','user_%');(r.data||[]).forEach(function(x){collect(x.data||{})})}catch(e){console.warn('云端聚合失败',e)}}
    else{try{for(var i=0;i<localStorage.length;i++){var key=localStorage.key(i);if(key.indexOf(DB_KEY+'_user_')===0){collect(readLocalRow(key)||{})}}}catch(e){console.warn('本地聚合失败',e)}}
  }else if(currentUser){
    var mine=await readCloudRow('user_'+currentUser.id)||readLocalRow(DB_KEY+'_user_'+currentUser.id)||{};
    PRIVATE_FIELDS.forEach(function(f){d[f]=(mine[f]||[])});
  }
  d.users=await loadAllAccounts(legacyUsers);
  return d;
}

var _modalDrag=null;

function _modalDragMove(e){
  if(!_modalDrag)return;
  var p=_modalPoint(e),dx=p.x-_modalDrag.sx,dy=p.y-_modalDrag.sy;
  var vw=window.innerWidth||document.documentElement.clientWidth;
  var vh=window.innerHeight||document.documentElement.clientHeight;

  var orders=getVisibleData('orders');

  var td=today();
function _dnum(d){var p=(d||'').split('-');return p[0]?Date.UTC(+p[0],+p[1]-1,+p[2]):0}
function _days(dep){if(!dep)return null;return Math.round((_dnum(dep)-_dnum(td))/86400000)}
var STEPS=[{key:'deposit',label:'收定金',short:'定'},{key:'sign',label:'签约',short:'签'},{key:'final',label:'收尾款',short:'尾'},{key:'invoice',label:'发票',short:'票'},{key:'confirm',label:'确认函',short:'函'}];
var _bl={deposit:'收付款',sign:'去签约',final:'收付款',invoice:'开发票',confirm:'确认函',none:'查看',fix:'去完善'};
var ACTION={deposit:'fin-new-receipt',final:'fin-new-receipt',sign:'sign-contract',invoice:'fin-new-invoice',confirm:'generate-confirm',none:'view-order',fix:'view-order'};
function calcOrder(o){
  var receiv=finOrderReceivable(o);
  var recs=receipts.filter(function(r){return r.orderId===o.id&&r.status==='已收'});
  var recv=recs.reduce(function(s,r){return s+(parseFloat(r.amount)||0)},0);
  var _depR=recs.find(function(r){return r.kind==='定金'||r.kind==='全款'||r.kind==='分期'});
  var hasDeposit=!!_depR;
  var fullyPaid=receiv>0&&recv>=receiv;
  var inv=invoices.find(function(x){return x.orderId===o.id&&x.status!=='已作废'});
  if(receiv<=0){return {zero:true,recv:0,receiv:0,state:{},pending:['待完善资料'],action:'fix'};}
  var st={};
  st.deposit=hasDeposit?'done':'current';
  st.sign=o.status==='已签约'?'done':(hasDeposit?'current':'todo');
  st.final=fullyPaid?'done':(hasDeposit?'current':'todo');
  st.invoice=inv?'done':(fullyPaid?'current':'todo');
  st.confirm=o.confirmGenerated?'done':(o.status==='已签约'?'current':'todo');
  /* 仅保留第一个未完成节点为「当前待办」（琥珀），其余未完成一律降为未开始（灰），
     保证签约、收尾款、发票、确认函按流程先后推进，不同时标琥珀 */
  var _fst=null;
  STEPS.forEach(function(s){if(st[s.key]==='current'&&!_fst)_fst=s.key;});
  STEPS.forEach(function(s){if(st[s.key]==='current'&&s.key!==_fst)st[s.key]='todo';});
  var _cur=STEPS.filter(function(s){return st[s.key]==='current'});
  var pend=_cur.map(function(s){return s.label});
  var action=_cur.length?_cur[0].key:'none';
  return {zero:false,recv:recv,receiv:receiv,state:st,pending:pend,action:action};
}

/* 会计凭证摘要生成规则：动词(收/付/退/借) + 团号/客户 + 业务内容，控制在 30 字以内。
   例：收取TG2026080001游客团款 / 支付TG2026080001酒店住宿费 / 退还TG2026080001旅游团费
   默认使用完整团号/客户名；仅当拼接后仍超出 30 字，才将过长团号压缩为「TG+末6位」，
   若仍超出，优先保留「动词+团号」，其次保留「动词+业务内容」。*/
function finVchSum(verb,who,biz){
  verb=verb||'';who=who||'';biz=biz||'';
  var full=verb+who+biz;
  if(full.length<=30)return full;
  if(who && /^(TG)?\d{8,}$/i.test(who)){ who='TG'+who.replace(/[^0-9]/g,'').slice(-6); }
  var full2=verb+who+biz;
  if(full2.length<=30)return full2;
  if((verb+who).length<=30)return verb+who;
  if((verb+biz).length<=30)return verb+biz;
  return full2.slice(0,30);
}

  var payRows=Array.prototype.slice.call(document.querySelectorAll('#payRows .pay-row')).filter(function(tr){return (tr.querySelector('.pp-cat').value||'').trim();}).map(function(tr){

  });

  var recvRows=Array.prototype.slice.call(document.querySelectorAll('#recvRows .recv-row')).map(function(tr){
    return {cat:tr.querySelector('.rc-cat').value.trim(), amount:Math.round((parseFloat(tr.querySelector('.rc-amt').value)||0)*100)/100, method:tr.querySelector('.rc-method').value.trim()};
  }).filter(function(r){return r.cat && r.amount>0});

  var hadBooked=DB.financeRecords.some(function(f){return f.tourGroupId===tgId && (f.src==='pay'||f.src==='recv'||f.src==='grpay'||f.src==='tgpay');});

     再写入当前表单内容 —— 实现「更新保存」= 更新旧总帐，绝不重复记账 / 重复生成凭证 */
  DB.finPayments=DB.finPayments.filter(function(p){return !(p.tourGroupId===tgId && p.tgPay);});
  DB.finReceipts=DB.finReceipts.filter(function(r){return !(r.tourGroupId===tgId);});
  DB.financeRecords=DB.financeRecords.filter(function(f){return !(f.tourGroupId===tgId && (f.src==='pay'||f.src==='recv'||f.src==='grpay'||f.src==='tgpay'));});
  DB.finVouchers=DB.finVouchers.filter(function(v){return !(v.tourGroupId===tgId);});
  var now=today();
  var gr=getVisibleData('finGuideReimbursements').find(function(x){return x.tourGroupId===tgId});
  var guideName=gr?gr.guideName:'';
  // 写入「支付明细」finPayments（逐行保存，保留 synced 标记）
  payRows.forEach(function(r){
    DB.finPayments.push({id:genId('p'),tourGroupId:tgId,cat:r.cat,kind:r.cat,payee:r.payee,amount:r.amount,date:tg.departureDate||now,status:r.amount>0?'已付':'待登记',createdBy:uid,tgPay:true,srcGr:r.synced});
  });
  // 总帐（financeRecords）逐行记录支出（仅金额>0）
  var expTotal=0;
  payRows.forEach(function(r){ if(r.amount<=0)return;
    DB.financeRecords.push({id:genId('f'),tourGroupId:tgId,type:'支出',category:r.cat,amount:r.amount,date:tg.departureDate||now,description:'付'+(r.payee||'供应商')+' '+r.cat,src:'tgpay',createdBy:uid});
    expTotal+=r.amount;
  });
  // 凭证：生成到一张凭证里，类别集合（各费用类别作为借方分录行，贷方统一为银行存款—团费结算户）
  var catMap={};
  payRows.forEach(function(r){ if(r.amount<=0||!r.cat)return; catMap[r.cat]=Math.round(((catMap[r.cat]||0)+r.amount)*100)/100; });
  if(expTotal>0){
    var entries=[];
    Object.keys(catMap).forEach(function(c){ entries.push({account:'6401主营业务成本—'+c,debit:catMap[c],credit:0}); });
    entries.push({account:'1002银行存款—团费结算户',debit:0,credit:Math.round(expTotal*100)/100});
    var v=finMakeVoucher(tg.departureDate||now, finVchSum('支付', tg.tourNo, '旅游团成本'), entries, tgId); v.srcTg=true;
  }
  // 收款明细（综合服务费）—— 逐行记录并各自生成凭证（保持原行为），统一标记 srcTg 便于更新时替换
  recvRows.forEach(function(r){
    DB.finReceipts.push({id:genId('r'),tourGroupId:tgId,customerName:tg.routeName||'团费',kind:r.cat,amount:r.amount,date:now,method:r.method||'现金',status:'已收',src:'tgpay',createdBy:uid});
    DB.financeRecords.push({id:genId('f'),tourGroupId:tgId,type:'收入',category:r.cat,amount:r.amount,date:now,description:'收'+r.cat,src:'tgpay',createdBy:uid});
    var rv=finMakeVoucher(now, finVchSum('收取', tg.tourNo, r.cat), [{account:'1002银行存款—团费结算户',debit:r.amount,credit:0},{account:'2203预收账款—预收团费',debit:0,credit:r.amount}],tgId); rv.srcTg=true;
  });
  finLog('团期支付登记', tg.tourNo+' 支付'+payRows.length+'项 / 收款'+recvRows.length+'项'+(hadBooked?'（更新保存）':'（首次计入）'));
  saveData();closeModal();showToast(hadBooked?'已更新并同步总账与凭证':'已保存并计入总账与凭证','success');renderFinance();
}

/* 自动引用团期行程数据 → 生成报销明细行，按报销项目类别逐一罗列（每个行程/供应商明细单独成行）
   （报销项目类别：餐饮 / 住宿 / 门票 / 交通费 / 导服费 / 旅游意外险）
   逻辑：餐饮·门票·保险按人数、住宿按间数(ceil(pax/2))、交通汽车按天数其余按人数、导服按天数；
   每条行程/供应商明细单独成行（不再合并同类别），按类别顺序排列 */
function finGrItemsFromTour(t){
  if(!t)return [];
  var pax=tourBookedPax(t);
  var days=t.duration||(t.itinerary?t.itinerary.length:1)||1;
  var raw=[];
  if(t.itinerary&&t.itinerary.length){
    t.itinerary.forEach(function(d){
      [['breakfast','早餐'],['lunch','中餐'],['dinner','晚餐']].forEach(function(m){
        var sid=d[m[0]+'SupplierId'];if(sid){var s=getSupplier(sid);if(s){var up=s.unitPrice||0;raw.push({cat:'餐饮',supplier:s.name,price:up,qty:pax,days:1,subtotal:Math.round(up*pax*100)/100});}}
      });
      if(d.hotelSupplierId){var hs=getSupplier(d.hotelSupplierId);if(hs){var rooms=Math.ceil(pax/2);var up=hs.unitPrice||0;raw.push({cat:'住宿',supplier:hs.name,price:up,qty:rooms,days:1,subtotal:Math.round(up*rooms*100)/100});}}
      var tIds=d.ticketSupplierIds||(d.ticketSupplierId?[d.ticketSupplierId]:[]);
      tIds.forEach(function(tid){var s=getSupplier(tid);if(s){var up=s.unitPrice||0;raw.push({cat:'门票',supplier:s.name,price:up,qty:pax,days:1,subtotal:Math.round(up*pax*100)/100});}});
    });
  }
  (t.transportSupplierIds||[]).forEach(function(tid){var s=getSupplier(tid);if(s){var isBus=(s.type==='汽车交通');var q=isBus?1:pax;var dy=isBus?days:1;var up=s.unitPrice||0;raw.push({cat:'交通费',supplier:s.name,price:up,qty:q,days:dy,subtotal:Math.round(up*q*dy*100)/100});}});
  var g=getGuide(t.guideId);if(g&&g.dailyFee){var up=g.dailyFee;raw.push({cat:'导服费',supplier:g.company||'',price:up,qty:1,days:days,subtotal:Math.round(up*days*100)/100});}
  if(t.insuranceSupplierId){var ins=getSupplier(t.insuranceSupplierId);if(ins){var up=ins.unitPrice||0;raw.push({cat:'旅游意外险',supplier:ins.name,price:up,qty:pax,days:1,subtotal:Math.round(up*pax*100)/100});}}
  /* 按报销项目类别逐一罗列：不再合并同类别明细，每个行程/供应商明细单独成行，按类别顺序排列 */
  var order=['餐饮','住宿','门票','交通费','导服费','旅游意外险'];
  var items=raw.map(function(it){return {cat:it.cat,supplier:it.supplier,price:it.price,qty:it.qty,days:it.days,subtotal:Math.round((it.subtotal||0)*100)/100,auto:true};});
  items.sort(function(a,b){var ia=order.indexOf(a.cat);if(ia<0)ia=order.length;var ib=order.indexOf(b.cat);if(ib<0)ib=order.length;return ia-ib;});
  return items;
}
/* 实时合并：报销单 = 当前团期最新派生的「自动引用项」 + 用户手动新增/改过的项（按 category 保留）。
   团期订单一变动，打开/查看报销单即按最新团期刷新自动项；手动项始终保留。 */
var GR_DERIVED_CATS=['餐饮','住宿','门票','交通费','导服费','旅游意外险'];
function finGrMergedItems(tg, rec){
  var derived=finGrItemsFromTour(tg);
  var rawManual=(rec&&rec.items)?rec.items:[];
  var manual=rawManual.filter(function(i){return !(i.auto===true && GR_DERIVED_CATS.indexOf(i.cat)>=0);})
    .map(function(i){return {cat:i.cat,supplier:i.supplier,price:i.price,amount:i.amount,qty:i.qty,days:i.days,subtotal:i.subtotal,auto:false};});
  return {items:derived.concat(manual), derived:derived, manual:manual};
}

/* 将某团期已生成的导游报账单，一键同步为往来帐务管理的团期支付项（并计入总账+生成凭证）。
   仅清理上次同步产生的记录（标记 srcGr），保留手动添加的支付项。 */
function finSyncGuideReimbToPay(tgId){

/* 订单分摊成本（按人头）：团期支付合计/团期总人数×订单人数（不含综合服务费，与税务口径一致） */
function finOrderAllocCost(o){
  if(!o||!o.tourGroupId)return 0;
  var tgId=o.tourGroupId,cost=0,pax=0;
  getVisibleData('finPayments').forEach(function(p){if(p.status==='已付'&&p.tourGroupId===tgId)cost+=p.amount});
  getVisibleData('orders').forEach(function(x){if(x.tourGroupId===tgId)pax+=(parseInt(x.pax)||0)});
  if(!pax)return 0;
  return Math.round((cost/pax*(parseInt(o.pax)||0))*100)/100;
}
/* 模块6：税务发票管理 */
/* 按订单开票口径：团期成本=(团期支付合计)/团期总人数 → 订单分摊成本=人均×订单人数；
   订单差额=订单收入−订单分摊成本−订单退款；返回全部订单差额合计。综合服务费不计入成本（与单团盈亏表等口径一致）。 */
function finTaxDiffByOrder(){
  var orders=finGetOrders();
  var tgCost={};
  getVisibleData('tourGroups').forEach(function(tg){tgCost[tg.id]={cost:0,pax:0}});
  getVisibleData('finPayments').forEach(function(p){if(p.status==='已付'&&p.tourGroupId&&tgCost[p.tourGroupId])tgCost[p.tourGroupId].cost+=p.amount});
  orders.forEach(function(o){if(o.tourGroupId&&tgCost[o.tourGroupId])tgCost[o.tourGroupId].pax+=(parseInt(o.pax)||0)});
  var diff=0;
  orders.forEach(function(o){
    var m=o.tourGroupId&&tgCost[o.tourGroupId];
    var unit=m&&m.pax>0?(m.cost/m.pax):0;
    var alloc=unit*(parseInt(o.pax)||0);
    diff+=Math.round((finIncome(o)-alloc-finRefundAmt(o))*100)/100;
  });
  return diff;
}

/* 以「团期(tourGroup)」为基本核算单位：
   收入 = 订单收款（团费，已含综合服务费佣金；综合服务费随团款一并计入，不单列）；
   成本 = 该团期「导游报账/团期支付登记」已付支付总额（地接等），按 tourGroupId 归集一次（不随订单数倍乘），不含借备用金；
   综合服务费为团款中的利润（佣金），仅在团期支付登记作业务登记/凭证，不额外计入收入或成本，避免与团款重复。*/
function finTourGroupAgg(){
  var tgMap={};
  getVisibleData('tourGroups').forEach(function(tg){tgMap[tg.id]={tg:tg,inc:0,cost:0,refund:0,orders:0}});
  var noneOrders=[];
  finGetOrders().forEach(function(o){
    /* 净额法：已取消订单不计入团期收入/退款/订单数（收款已退、服务未发生），其团期成本仍照实计入 */
    if(o.status==='已取消')return;
    if(o.tourGroupId&&tgMap[o.tourGroupId]){
      var m=tgMap[o.tourGroupId];m.orders++;m.inc+=finIncome(o);m.refund+=finRefundAmt(o);
    } else { noneOrders.push(o); }
  });
  if(noneOrders.length){
    tgMap.__none__={tg:{id:'__none__',tourNo:'未分配',routeName:'未分配团期'},inc:0,cost:0,refund:0,orders:noneOrders.length};
    noneOrders.forEach(function(o){ tgMap.__none__.inc+=finIncome(o); tgMap.__none__.refund+=finRefundAmt(o); });
  }
  /* 综合服务费（团期支付登记的收款明细）已包含在订单团款收入中，是团款里的利润，
     仅作业务登记与凭证，不再额外计入团期收入/成本，避免与团款重复加计。 */
/* 成本：团期口径 —— 该团期所有「已付」支付项（导游报账/团期支付登记/手动添加）之和，
   按 tourGroupId 归集一次，不按订单倍乘；不含借备用金、不含综合服务费 */
  getVisibleData('finPayments').forEach(function(p){
    if(p.status!=='已付')return;
    if(p.tourGroupId&&tgMap[p.tourGroupId])tgMap[p.tourGroupId].cost+=p.amount;
    else if(!p.tourGroupId&&tgMap.__none__)tgMap.__none__.cost+=p.amount;
  });
  return tgMap;
}

function pay2(){var s=0;getVisibleData('finPayments').forEach(function(p){if(p.status!=='已付')s+=p.amount});return s}
function cashIn(){var s=0;getVisibleData('finReceipts').forEach(function(r){if(r.status==='已收'&&r.src!=='tgpay')s+=r.amount});return s}
function cashOut(){var s=0;getVisibleData('finPayments').forEach(function(p){if(p.status==='已付')s+=p.amount});return s}
/* 按团期聚合现金流量（与现金流量表口径一致）：
   流入 = 该团订单的收款（status='已收' 且 src!=='tgpay'，剔除综合服务费内部结转）；
   流出 = 该团期「已付」付款之和。未分配团期的订单收款/付款归入 __none__。 */
function finCashAgg(){
  var m={};
  getVisibleData('tourGroups').forEach(function(tg){m[tg.id]={tg:tg,in:0,out:0}});
  var orders=finGetOrders();
  getVisibleData('finReceipts').forEach(function(r){
    if(r.status!=='已收'||r.src==='tgpay')return;
    var o=orders.find(function(x){return x.id===r.orderId});
    var tgid=o&&o.tourGroupId;
    if(tgid&&m[tgid])m[tgid].in+=r.amount;
    else{if(!m.__none__)m.__none__={tg:{id:'__none__',tourNo:'未分配',routeName:'未分配团期'},in:0,out:0};m.__none__.in+=r.amount;}
  });
  getVisibleData('finPayments').forEach(function(p){
    if(p.status!=='已付')return;
    if(p.tourGroupId&&m[p.tourGroupId])m[p.tourGroupId].out+=p.amount;
    else{if(!m.__none__)m.__none__={tg:{id:'__none__',tourNo:'未分配',routeName:'未分配团期'},in:0,out:0};m.__none__.out+=p.amount;}
  });
  /* 退团退款计入现金流出：款项已实际付出。此前只统计 finPayments（供应商付款/报账），
     而取消订单的退款记在 finRefunds/financeRecords，导致现金流量表漏记流出、已取消订单净流量虚高为正。
     补记后，已取消订单「收款流入」与「退款流出」相抵，净流量为 0。 */
  getVisibleData('finRefunds').forEach(function(rf){
    if(rf.status!=='已退')return;
    var _ro=orders.find(function(x){return x.id===rf.orderId});
    var _rtgid=_ro&&_ro.tourGroupId;
    if(_rtgid&&m[_rtgid])m[_rtgid].out+=rf.amount;
    else{if(!m.__none__)m.__none__={tg:{id:'__none__',tourNo:'未分配',routeName:'未分配团期'},in:0,out:0};m.__none__.out+=rf.amount;}
  });
  return m;
}
/* 看板「总收入 / 主营业务收入 / 预收账款」口径：
   收取游客的所有款项 = 订单团款（团费收入，已含综合服务费佣金）等实际收款；
   剔除「团期支付登记」单独记账的综合服务费（src='tgpay' 收入）——该佣金已包含在订单团款中，
   不应在团费之外重复加计，否则总收入虚高。例：游客付团费100元（含佣金10），总收入=100而非110。 */
function finTouristIncome(){
  var _c=finCancelledOrderIds();
  var s=0;getVisibleData('financeRecords').forEach(function(f){
    if(f.type!=='收入')return;
    if(f.src==='tgpay')return;
    /* 净额法：已取消订单的收款不计入收入（服务未发生、款项已退）；其退款同步不计入支出，净贡献为 0 */
    if(f.orderId&&_c[f.orderId])return;
    s+=f.amount;
  });
  return s;
}
/* 净额法口径（与 finTouristIncome 成对使用）：已取消订单不参与经营成果核算。
   - 已取消订单的收款不计入收入，其「退团退款」亦不计入支出，两者相抵，净贡献为 0；
   - 团期成本按 tourGroupId 归集（无 orderId），不受影响，仍照实计入成本。 */
function finCancelledOrderIds(){var s={};finGetOrders().forEach(function(o){if(o.status==='已取消')s[o.id]=1});return s}
function finTotalExpense(){var _c=finCancelledOrderIds();var s=0;getVisibleData('financeRecords').forEach(function(f){if(f.type!=='支出')return;if(f.orderId&&_c[f.orderId])return;s+=f.amount});return s}

/* 恢复/补充基础档案预设（会计科目 / 税率与计税方式 / 费用分类）
   按 编码/id/名称 去重，仅补充缺失项，绝不删除用户已有数据；返回新增条数。
   预设取自 getDefaultData() 中的种子数组（种子为 getDefaultData 局部变量，故经此获取，避免作用域问题） */
function finRestoreArchivePresets(){
  var def=getDefaultData();
  var added=0;
  var acct={};DB.finAccounts.forEach(function(a){acct[a.code]=true});
  (def.finAccounts||[]).forEach(function(a){if(!acct[a.code]){DB.finAccounts.push(a);added++;acct[a.code]=true}});
  var tax={};DB.finTaxRates.forEach(function(t){tax[t.id]=true});

/* 金额数字 -> 人民币大写 */
function rmbUpper(amount){
var num=Number(amount);if(isNaN(num))return '';
var head=num<0?'负':'';num=Math.abs(num);
var cents=Math.round(num*100);
if(cents>99999999999999)return '金额超出范围';
var digit=['零','壹','贰','叁','肆','伍','陆','柒','捌','玖'];
var unit=[['元','万','亿','万亿'],['','拾','佰','仟']];
var jiao=Math.floor(cents/10)%10,fen=cents%10,yuan=Math.floor(cents/100);
var s='';
s+=(digit[jiao]+'角').replace(/零./,'');
s+=(digit[fen]+'分').replace(/零./,'');
s=s||'整';
var n=yuan;
for(var i=0;i<unit[0].length&&n>0;i++){
var p='';
for(var j=0;j<unit[1].length&&n>0;j++){p=digit[n%10]+unit[1][j]+p;n=Math.floor(n/10)}
s=p.replace(/(零.)*零$/,'').replace(/^$/,'零')+unit[0][i]+s}
var res=s.replace(/(零.)*零元/,'元').replace(/(零.)+/g,'零').replace(/^整$/,'零元整');
if(yuan>0&&jiao===0&&fen>0)res=res.replace(/元([壹贰叁肆伍陆柒捌玖]分)$/,'元零$1');
return head+res}

/* ===== 共享档案写权限 =====
   业务档案（供应商/导游/团期）：作者本人可修改、删除；教师可改全部。
   财务基础档案（会计科目/税率/审批模板/银行账户/期初余额）与截单：仍仅教师。 */
function _archiveBizKind(action){var m={'edit-supplier':'suppliers','delete-supplier':'suppliers','save-supplier':'suppliers','edit-guide':'guides','delete-guide':'guides','save-guide':'guides','edit-tour':'tourGroups','delete-tour':'tourGroups','save-tour':'tourGroups'};return m[action]||null}
function canEditArchive(rec){if(!currentUser)return false;if(currentUser.role==='teacher')return true;if(!rec)return false;return rec.createdBy===currentUser.id}
/* 共享档案被他人业务数据引用计数（本人自建数据不计，允许自行删除） */
function archiveOtherRefs(kind,id){
  var me=currentUser?currentUser.id:null,n=0;
  function other(x){return x&&x.createdBy!==me}
  if(kind==='tourGroups'){
    (DB.orders||[]).forEach(function(o){if(o.tourGroupId===id&&other(o))n++});
    ['finPayments','finReceipts','finAdvances'].forEach(function(f){(DB[f]||[]).forEach(function(r){if(r.tourGroupId===id&&other(r))n++})});
  }else if(kind==='guides'){
    (DB.tourGroups||[]).forEach(function(t){if(other(t)&&(t.guideId===id||t.leaderId===id||t.fullGuideId===id))n++});
  }else if(kind==='suppliers'){
    (DB.tourGroups||[]).forEach(function(t){
      if(!other(t))return;
      if(t.insuranceSupplierId===id)n++;
      (t.transportSupplierIds||[]).forEach(function(s){if(s&&s===id)n++});
      (t.itinerary||[]).forEach(function(d){Object.keys(d||{}).forEach(function(k){if(k.indexOf('SupplierId')>=0&&d[k]===id)n++})});
    });
  }
  return n;
}

      }

}

function pad2(n){return (n<10?'0':'')+n}
function fmtDateCn(s){if(!s)return '';var m=(''+s).match(/(\d{4})-(\d{2})-(\d{2})/);if(!m)return '';return m[1]+'年'+m[2]+'月'+m[3]+'日'}
function parseYmd(s){if(!s)return null;var m=(''+s).match(/(\d{4})-(\d{2})-(\d{2})/);if(!m)return null;return {y:+m[1],m:+m[2],d:+m[3]}}
/* 根据出发日期与送团日期计算行程天数（含首尾，如 8/1-8/3 = 3 天）；缺任一日期返回 null */
function calcTourDuration(a,b){
  if(!a||!b)return null;
  var da=Date.parse(a+'T00:00:00'),db=Date.parse(b+'T00:00:00');
  if(isNaN(da)||isNaN(db))return null;
  var days=Math.round((db-da)/86400000);
  return days+1<1?1:days+1;
}
function recalcTourDuration(){
  var d1=$('tf_departureDate'),d2=$('tf_sendOffTime'),out=$('tf_duration');
  if(!d1||!d2||!out)return;
  var v=calcTourDuration(d1.value,d2.value);
  out.value=(v===null?1:v);
}

    if(nav){e.stopPropagation();var a=nav.getAttribute('data-nav');
      if(a==='mm-'){_dpState.m--;if(_dpState.m<1){_dpState.m=12;_dpState.y--}}
      else if(a==='mm+'){_dpState.m++;if(_dpState.m>12){_dpState.m=1;_dpState.y++}}
      else if(a==='yy-'){_dpState.y--}
      else if(a==='yy+'){_dpState.y++}
      else if(a==='today'){var t=new Date();_dpState={y:t.getFullYear(),m:t.getMonth()+1,d:t.getDate()}}
      else if(a==='clear'){_dpCommit('');return}
      _dpRender();return;
    }
    var cell=e.target.closest('.dp-cell');
    if(cell&&cell.getAttribute('data-y')){e.stopPropagation();_dpCommit(cell.getAttribute('data-y')+'-'+cell.getAttribute('data-m')+'-'+cell.getAttribute('data-d'));}
  });
  _dpPopup=p;return p;
}
function _dpRender(){
  var y=_dpState.y,m=_dpState.m;
  _dpPopup.querySelector('.dp-title').textContent=y+'年 '+pad2(m)+'月';
  var grid=_dpPopup.querySelector('.dp-grid');
  var first=new Date(y,m-1,1);
  var startDow=(first.getDay()+6)%7;
  var daysInMonth=new Date(y,m,0).getDate();
  var prevDays=new Date(y,m-1,0).getDate();
  var html='';
  var i;
  for(i=startDow-1;i>=0;i--){html+='<div class="dp-cell dp-other" data-y="'+y+'" data-m="'+pad2(m)+'" data-d="'+pad2(prevDays-i)+'">'+(prevDays-i)+'</div>'}
  var sel=_dpTarget?document.getElementById(_dpTarget).value:'';
  var t=new Date();var tstr=t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate());
  for(var d=1;d<=daysInMonth;d++){
    var cls='dp-cell';var ymd=y+'-'+pad2(m)+'-'+pad2(d);
    if(ymd===tstr)cls+=' dp-today';
    if(sel&&ymd===sel)cls+=' dp-selected';
    html+='<div class="'+cls+'" data-y="'+y+'" data-m="'+pad2(m)+'" data-d="'+pad2(d)+'">'+d+'</div>';
  }
  var total=startDow+daysInMonth;var trail=42-total;if(trail<0)trail+=42;
  for(var k=1;k<=trail;k++){html+='<div class="dp-cell dp-other" data-y="'+y+'" data-m="'+pad2(m)+'" data-d="'+pad2(k)+'">'+k+'</div>'}
  grid.innerHTML=html;
}
function _dpCommit(val){
  if(_dpTarget){
    var el=document.getElementById(_dpTarget);
    el.value=val;
    var view=document.getElementById(_dpTarget+'_view');
    if(view)view.value=fmtDateCn(val);
    el.dispatchEvent(new Event('input',{bubbles:true}));
  }
  _dpClose();
}
function _dpClose(){if(_dpPopup)_dpPopup.style.display='none';_dpTarget=null;}
function openDatePicker(trigger){
  var target=trigger.getAttribute('data-target');if(!target)return;
  ensureDatePicker();
  var cur=document.getElementById(target).value;
  var p=parseYmd(cur);
  if(p){_dpState={y:p.y,m:p.m,d:p.d}}else{var t=new Date();_dpState={y:t.getFullYear(),m:t.getMonth()+1,d:t.getDate()}}
  _dpTarget=target;
  _dpRender();
  _dpPopup.style.display='block';
  var r=trigger.getBoundingClientRect();
  var pw=_dpPopup.offsetWidth,ph=_dpPopup.offsetHeight;
  var left=r.left;if(left+pw>window.innerWidth-8)left=window.innerWidth-pw-8;if(left<8)left=8;
  var top=r.bottom+6;if(top+ph>window.innerHeight-8)top=r.top-ph-6;if(top<8)top=8;
  _dpPopup.style.left=left+'px';_dpPopup.style.top=top+'px';
}
document.addEventListener('click',function(e){
  var trig=e.target.closest&&e.target.closest('.date-picker');
  if(trig){if(trig.tagName==='INPUT')e.preventDefault();openDatePicker(trig);return;}
  if(_dpPopup&&_dpPopup.style.display==='block'){
    if(!_dpPopup.contains(e.target))_dpClose();
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&_dpPopup&&_dpPopup.style.display==='block')_dpClose()});
/* ===== 可搜索下拉组件（全局自动增强） ===== */
function ssForEach(nodes,fn){Array.prototype.forEach.call(nodes,fn)}
function closeAllSSPopups(){
  ssForEach(document.querySelectorAll('.ss-popup'),function(p){p.style.display='none'});
  ssForEach(document.querySelectorAll('.ss-control.open'),function(c){c.classList.remove('open')});
}
function enhanceSearchSelect(sel){
  if(!sel||sel.dataset.ssDone||sel.tagName!=='SELECT')return;
  var opts=sel.options;
  if(sel.hasAttribute('data-no-search'))return; /* 显式排除（筛选器/交通类型等已各自带搜索） */
  /* ≤2 项短列表：保留"不搜索"语义，但仍升级为自定义外观，与长列表视觉统一；
     data-force-search 可强制带搜索；data-no-searchbox 显式免搜索框。等价于给每个短下拉框加 data-no-searchbox */
  var noSearch=sel.hasAttribute('data-no-searchbox')||(opts.length<=2 && !sel.hasAttribute('data-force-search'));
  sel.dataset.ssDone='1';
  var wrap=document.createElement('div');wrap.className='ss-wrap'+(sel.className?(' '+sel.className):'');
  sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(sel);
  sel.style.display='none';
  var initVal=sel.value;var cur=null;
  ssForEach(opts,function(o){if(o.value===initVal)cur=o;});
  if(!cur)cur=opts[sel.selectedIndex]||opts[0];
  var control=document.createElement('div');control.className='ss-control';control.tabIndex=0;
  control.innerHTML='<span class="ss-text"></span><svg class="ss-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
  control.querySelector('.ss-text').textContent=cur?cur.textContent:(opts.length?opts[0].textContent:'');
  wrap.appendChild(control);
  var popup=document.createElement('div');popup.className='ss-popup';popup.style.display='none';
  popup.innerHTML=(noSearch?'':'<div class="ss-search-wrap"><input class="ss-search" type="text" placeholder="输入关键字搜索…"></div>')+'<div class="ss-list"></div><div class="ss-empty" style="display:none">无匹配结果</div>';
  wrap.appendChild(popup);
  var search=popup.querySelector('.ss-search');
  var list=popup.querySelector('.ss-list');
  var empty=popup.querySelector('.ss-empty');
  function buildList(filter){
    filter=(filter||'').trim().toLowerCase();
    list.innerHTML='';var any=false;
    ssForEach(opts,function(o,i){
      if(filter&&o.textContent.toLowerCase().indexOf(filter)<0)return;
      any=true;
      var item=document.createElement('div');item.className='ss-option'+(o.selected?' selected':'');
      item.textContent=o.textContent;item.dataset.idx=i;
      item.addEventListener('click',function(ev){
        ev.stopPropagation();
        var idx=+this.dataset.idx;
        sel.value=opts[idx].value;
        sel.selectedIndex=idx;
        control.querySelector('.ss-text').textContent=opts[idx].textContent;
        closeAllSSPopups();
        sel.dispatchEvent(new Event('input',{bubbles:true}));
        sel.dispatchEvent(new Event('change',{bubbles:true}));
      });
      list.appendChild(item);
    });
    empty.style.display=any?'none':'block';
  }
  function openPopup(){
    closeAllSSPopups();
    popup.style.display='block';control.classList.add('open');
    if(search)search.value='';
    buildList('');
    if(search)setTimeout(function(){search.focus()},10);
  }
  control.addEventListener('click',function(e){e.stopPropagation();if(popup.style.display==='block')closeAllSSPopups();else openPopup();});
  control.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '||e.key==='ArrowDown'){e.preventDefault();if(popup.style.display!=='block')openPopup();}
    else if(e.key==='Escape'){closeAllSSPopups();}
  });
  if(search){
    search.addEventListener('input',function(){buildList(search.value)});
    search.addEventListener('keydown',function(e){
      if(e.key==='ArrowDown'){e.preventDefault();var f=list.querySelector('.ss-option');if(f){ssForEach(list.querySelectorAll('.ss-option'),function(x){x.classList.remove('hl')});f.classList.add('hl');}}
      else if(e.key==='Enter'){e.preventDefault();var h=list.querySelector('.ss-option.hl')||list.querySelector('.ss-option');if(h)h.click();}
      else if(e.key==='Escape'){closeAllSSPopups();control.focus();}
    });
  }
  /* 供外部在修改原生 select 值后刷新显示 */
  sel._ssRefresh=function(){var v=sel.value;var c=null;ssForEach(opts,function(o){if(o.value===v)c=o;});if(!c)c=opts[sel.selectedIndex]||opts[0];if(c)control.querySelector('.ss-text').textContent=c.textContent;};
}
function enhanceSearchSelects(root){
  if(!root)root=document;
  if(!root.querySelectorAll)return;
  ssForEach(root.querySelectorAll('select:not([data-ss-done])'),enhanceSearchSelect);
}
var _ssObserver=new MutationObserver(function(muts){
  ssForEach(muts,function(m){ssForEach(m.addedNodes,function(n){
    if(n.nodeType===1){if(n.tagName==='SELECT')enhanceSearchSelect(n);else if(n.querySelectorAll)enhanceSearchSelects(n);}
  });});
});
_ssObserver.observe(document.body,{childList:true,subtree:true});
document.addEventListener('click',function(e){if(!e.target.closest||!e.target.closest('.ss-wrap'))closeAllSSPopups();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAllSSPopups();});
document.addEventListener('DOMContentLoaded',initApp);
})();
</script>
